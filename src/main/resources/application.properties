spring.application.name=HNHSTORE
server.port=8080
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=hnhstore_login;integratedSecurity=true;authenticationScheme=NativeAuthentication;encrypt=true;trustServerCertificate=true}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
