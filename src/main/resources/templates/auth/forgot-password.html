<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Quên mật khẩu')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="panel auth-panel">
  <h1>Quên mật khẩu</h1>
  <p class="success" th:if="${success}" th:text="${success}"></p>
  <form th:action="@{/forgot-password}" method="post">
    <label for="email">Email tài khoản</label><input id="email" name="email" type="email" required>
    <button type="submit">Gửi OTP</button>
  </form>
  <p><a th:href="@{/reset-password}">Đã có OTP? Đặt mật khẩu mới</a></p>
</main>
</body>
</html>
