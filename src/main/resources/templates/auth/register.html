<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Đăng ký')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="panel auth-panel">
  <h1>Đăng ký HNHSTORE</h1>
  <form th:action="@{/register}" th:object="${form}" method="post">
    <p class="error" th:each="e : ${#fields.allErrors()}" th:text="${e}"></p>
    <label for="username">Username</label><input id="username" th:field="*{username}" required>
    <label for="email">Email</label><input id="email" th:field="*{email}" type="email" required>
    <label for="fullName">Họ tên</label><input id="fullName" th:field="*{fullName}" required>
    <label for="password">Mật khẩu</label><input id="password" th:field="*{password}" type="password" required>
    <label for="confirmPassword">Nhập lại mật khẩu</label><input id="confirmPassword" th:field="*{confirmPassword}" type="password" required>
    <button type="submit">Gửi OTP đăng ký</button>
  </form>
  <a th:href="@{/login}">Đã có tài khoản?</a>
</main>
</body>
</html>
