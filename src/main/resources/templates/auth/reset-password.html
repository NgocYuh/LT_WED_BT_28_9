<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Đặt lại mật khẩu')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="panel auth-panel">
  <h1>Đặt lại mật khẩu</h1>
  <form th:action="@{/reset-password}" th:object="${form}" method="post">
    <p class="error" th:each="e : ${#fields.allErrors()}" th:text="${e}"></p>
    <label for="email">Email</label><input id="email" th:field="*{email}" type="email" required>
    <label for="code">OTP 6 số</label><input id="code" th:field="*{code}" inputmode="numeric" pattern="[0-9]{6}" required>
    <label for="password">Mật khẩu mới</label><input id="password" th:field="*{password}" type="password" required>
    <label for="confirmPassword">Nhập lại mật khẩu</label><input id="confirmPassword" th:field="*{confirmPassword}" type="password" required>
    <button type="submit">Đổi mật khẩu</button>
  </form>
</main>
</body>
</html>
