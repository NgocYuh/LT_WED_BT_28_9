<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Đăng nhập')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="panel auth-panel">
  <h1>Đăng nhập HNHSTORE</h1>
  <p class="error" th:if="${param.error}">Username/email hoặc mật khẩu không đúng.</p>
  <p class="success" th:if="${param.logout}">Bạn đã đăng xuất.</p>
  <form th:action="@{/login}" method="post">
    <label for="username">Username hoặc email</label>
    <input id="username" name="username" type="text" autocomplete="username" required autofocus>
    <label for="password">Mật khẩu</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Đăng nhập</button>
  </form>
</main>
</body>
</html>
