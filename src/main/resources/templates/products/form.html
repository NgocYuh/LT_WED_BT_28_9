<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}">
<head><title>Sản phẩm</title></head><body>
<main layout:fragment="content" class="panel">
  <h1 th:text="${title}"></h1>
  <form th:action="@{${action}}" th:object="${form}" method="post" enctype="multipart/form-data">
    <p class="error" th:each="e : ${#fields.allErrors()}" th:text="${e}"></p>
    <label>Tên <input th:field="*{name}" required></label>
    <label>Mô tả <textarea th:field="*{description}"></textarea></label>
    <label>Giá <input th:field="*{price}" type="number" min="0" step="0.01" required></label>
    <div th:if="${product != null and product.imageUrl != null}"><img th:src="${product.imageUrl}" width="120" alt="Ảnh hiện tại"></div>
    <label>Ảnh JPG, PNG hoặc WebP (tối đa 5 MB) <input th:field="*{image}" type="file" accept="image/jpeg,image/png,image/webp"></label>
    <label th:if="${product != null}">Xóa ảnh cũ <input th:field="*{removeImage}" type="checkbox"></label>
    <button type="submit">Lưu</button>
  </form>
  <a th:href="@{/products}">Trở lại</a>
</main></body></html>
